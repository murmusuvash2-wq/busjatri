name: Internal linking — related routes on route pages

# One-shot, idempotent. Route pages were almost dead ends internally (one link
# into bus-time-table/ per page), which keeps them stuck at position 8-12.
# scripts/add_related_links.py adds a "Related routes & operators" block to each
# route page: reverse route, other routes from the same origin, other routes to
# the same destination, the operator page(s) and the "Buses from <origin>" page.
# Every target is verified to exist before it is linked.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Add related-route links
        run: python3 scripts/add_related_links.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "seo: add related-route internal links to route pages"
            git pull --rebase origin main
            git push
          fi
