name: Content check (content/)

on:
  workflow_dispatch:
  push:
    paths:
      - "content/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate content/
        run: python3 scripts/check_content.py
