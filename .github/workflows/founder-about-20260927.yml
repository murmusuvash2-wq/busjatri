name: Founder section about 20260927

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  founder:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Download founder photo
        run: |
          curl -sL -A "Mozilla/5.0" "https://media.licdn.com/dms/image/v2/D4D03AQGEPPo6rISbtQ/profile-displayphoto-shrink_400_400/B4DaDhAqeUKgAU-/0/1790481442952?e=1792022400&v=beta&t=ZYaeGz-hhNL9N7E2iGpvW4QJOYrHVBbdhsq46-PYCyY" -o founder.jpg
          file founder.jpg | grep -qi jpeg || (echo "photo download failed"; exit 1)
          echo "founder.jpg: $(du -k founder.jpg | cut -f1) KB"

      - name: Insert founder section into about.html
        run: |
          python3 - <<'FNDR_EOF'
          import io, textwrap

          SECTION = """
          <section id="founder" style="max-width:820px;margin:0 auto;padding:0 18px 26px">
          <style>
          .founder-card{background:var(--surface,#fffcf4);border:1.5px solid var(--line,#e5decf);border-radius:16px;padding:24px;display:flex;gap:18px;align-items:center}
          .founder-card .f-photo{width:88px;height:88px;border-radius:50%;object-fit:cover;border:2.5px solid var(--accent,#b8791f);flex:0 0 88px}
          .founder-card .f-name{display:flex;align-items:center;gap:7px;font-weight:800;font-size:18px;color:var(--ink,#211c16)}
          .founder-card .f-role{font-size:12px;color:var(--accent,#b8791f);font-weight:700;letter-spacing:.06em;margin-top:3px}
          .founder-card .f-bio{margin-top:14px;font-size:14px;color:var(--ink-dim,#6b6355);line-height:1.7}
          .founder-card .f-bio p+p{margin-top:8px}
          .founder-card .f-bio .f-en{font-size:12.5px;opacity:.85}
          .founder-card .f-link{display:inline-flex;align-items:center;gap:6px;margin-top:14px;font-size:12.5px;font-weight:700;color:#0a66c2;text-decoration:none;border:1px solid #b8d4f0;background:#eef5fd;padding:7px 14px;border-radius:999px}
          .founder-card .f-link:hover{background:#dbe9f9}
          .founder-card .vbadge{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;background:#0a66c2;color:#fff;flex:0 0 16px}
          .founder-card .vbadge svg{width:9px;height:9px}
          @media(max-width:600px){.founder-card{flex-direction:column;text-align:center;gap:14px}}
          </style>
          <div class="founder-card">
          <img class="f-photo" src="founder.jpg" alt="Suvash Murmu — Founder, BusJatri" width="88" height="88" loading="lazy">
          <div>
          <div class="f-name">Suvash Murmu
          <span class="vbadge" title="Verified on LinkedIn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
          </div>
          <div class="f-role">FOUNDER, BUSJATRI</div>
          <div class="f-bio">
          <p>আমি সুভাস মুর্মু — পশ্চিমবঙ্গের বাঁকুড়া থেকে। প্রায় ছয় বছর ধরে আমি অনলাইনে কাজ করেছি, বিদেশের ক্লায়েন্টদের জন্য ওয়েবসাইট তৈরি করেছি। এই কাজের ফাঁকে বারবার একটা সমস্যার মুখে পড়েছি: প্রতিদিন যে বাসগুলো বাংলার যাত্রী বহন করে, সেগুলোর কোনো টাইমটেবিল কোথাও নেই — এক জায়গায় নেই, কোনো ভাষায় নেই।</p>
          <p>তাই আমি BusJatri তৈরি করেছি — এক একটা স্টপ ধরে, এক একটা জেলা ধরে, বাংলা ও ইংরেজি দুই ভাষাতেই। আপনারা এখানে যা দেখছেন তা একজন মানুষের কাজ, যা যাত্রীদের একটি সম্প্রদায়ের সঙ্গে সঙ্গে এগিয়ে চলেছে।</p>
          <p class="f-en">From Bankura, West Bengal — about six years building websites for clients abroad, until one question wouldn't go away: why do the buses that carry Bengal every day have no timetable anywhere? BusJatri is my answer — stop by stop, district by district, in both Bengali and English.</p>
          </div>
          <a class="f-link" href="https://www.linkedin.com/in/suvash-murmu" target="_blank" rel="noopener">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.47-.9 1.63-1.85 3.36-1.85 3.6 0 4.27 2.37 4.27 5.45v6.29zM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12zM7.12 20.45H3.56V9h3.56v11.45z"/></svg>
          Verified on LinkedIn</a>
          </div>
          </div>
          </section>

          """

          SECTION = textwrap.dedent(SECTION).strip()

          with io.open("about.html", encoding="utf-8") as f:
              src = f.read()
          if "founder-card" in src:
              print("already patched - nothing to do")
              raise SystemExit(0)
          anchor = "</main>"
          assert src.count(anchor) == 1, "anchor </main> not unique"
          src = src.replace(anchor, SECTION + "\n" + anchor)
          assert "founder-card" in src and src.count("</main>") == 1
          with io.open("about.html", "w", encoding="utf-8") as f:
              f.write(src)
          print("about.html: founder section inserted before </main>")
          FNDR_EOF

      - name: Validate
        run: |
          file founder.jpg | grep -qi jpeg
          grep -q 'founder-card' about.html
          grep -q 'Suvash Murmu' about.html
          grep -q 'linkedin.com/in/suvash-murmu' about.html
          grep -q 'alt="Suvash Murmu' about.html
          grep -q 'f-bio' about.html
          python3 -c "from html.parser import HTMLParser; HTMLParser().feed(open('about.html', encoding='utf-8').read()); print('html parse ok')"
          echo "validation OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add about.html founder.jpg
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "About: add founder section (photo, bio EN+BN, LinkedIn link)"
            git push
          fi
