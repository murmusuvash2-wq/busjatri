          def insert_block(src, dict_name, block):
              """Insert block before the closing '}' of a top-level dict."""
              start = src.index(dict_name + " = {")
              close = src.index("\n}\n", start)
              return src[:close + 1] + block + src[close + 1:]

          def patch_generator():
              p = os.path.join(ROOT, "scripts", "gen_stand_v2.py")
              with open(p, encoding="utf-8") as fh:
                  src = fh.read()
              if '"khatra": {' in src:
                  print("generator already has batch-2 guides")
                  return
              assert '"medinipur": {' not in src.split("GUIDES_BN = {")[0], "unexpected medinipur in GUIDES"
              src = insert_block(src, "GUIDES", EN_BLOCK)
              src = insert_block(src, "GUIDES_BN", BN_BLOCK)
              with open(p, "w", encoding="utf-8") as fh:
                  fh.write(src)
              compile(src, p, "exec")
              print("GUIDES + GUIDES_BN patched (khatra, manbazar, medinipur)")

          def run(cmd):
              print("$", " ".join(cmd))
              r = subprocess.run(cmd, cwd=ROOT, capture_output=True, text=True)
              print(r.stdout)
              if r.returncode != 0:
                  print(r.stderr)
                  sys.exit("FAILED: " + " ".join(cmd))

          def validate():
              checks = {
                  "bus-time-table/buses-from-khatra.html":
                      ["Mukutmanipur Dam", "Jhilimili–Sutan Forest", "Bonpukuria Deer Park", "Masak Hill",
                       'canonical" href="https://busjatri.in/bus-time-table/buses-from-khatra"'],
                  "bus-time-table/buses-from-manbazar.html":
                      ["Doladanga", "Pakbirra Jain Temples", "Banda Deul",
                       'canonical" href="https://busjatri.in/bus-time-table/buses-from-manbazar"'],
                  "bus-time-table/buses-from-medinipur.html":
                      ["Karnagarh Temples", "Pathra", "Gopegarh", "Birsingha", "Gangani",
                       'canonical" href="https://busjatri.in/bus-time-table/buses-from-medinipur"'],
              }
              expect_cards = {"khatra": 4, "manbazar": 3, "medinipur": 5}
              for path, needles in checks.items():
                  with open(os.path.join(ROOT, path), encoding="utf-8") as fh:
                      s = fh.read()
                  for n in needles:
                      assert n in s, (path, n)
                  assert "G-L4E3D1YX9X" in s, (path, "GA4 missing")
                  slug = path.split("buses-from-")[1][:-5]
                  got = s.count('<div class="tg-card">')
                  assert got == expect_cards[slug], (path, got)
                  # Bengali side present
                  assert "মুকুটমণিপুর" in s or "পাকবিরা" in s or "কর্ণগড়" in s, (path, "BN text missing")
                  print(path, "OK,", got, "guide cards")

          def main():
              patch_generator()
              run([sys.executable, "scripts/gen_stand_v2.py", "--stands", "Khatra,Manbazar,Medinipur"])
              run([sys.executable, "scripts/add_ga4.py"])
              run([sys.executable, "scripts/fix_clean_urls.py"])
              validate()


          if __name__ == "__main__":
              main()
          APPLYEOF

      - name: Run apply
        run: python3 scripts/apply_stand_guides_batch2.py

      - name: Validate
        run: |
          grep -q 'Mukutmanipur Dam' bus-time-table/buses-from-khatra.html
          grep -q 'Masak Hill' bus-time-table/buses-from-khatra.html
          grep -q 'Pakbirra Jain Temples' bus-time-table/buses-from-manbazar.html
          grep -q 'Doladanga' bus-time-table/buses-from-manbazar.html
          grep -q 'Karnagarh Temples' bus-time-table/buses-from-medinipur.html
          grep -q 'Gangani' bus-time-table/buses-from-medinipur.html
          grep -q 'G-L4E3D1YX9X' bus-time-table/buses-from-khatra.html
          grep -q 'canonical" href="https://busjatri.in/bus-time-table/buses-from-khatra"' bus-time-table/buses-from-khatra.html
          grep -q 'canonical" href="https://busjatri.in/bus-time-table/buses-from-manbazar"' bus-time-table/buses-from-manbazar.html
          grep -q 'canonical" href="https://busjatri.in/bus-time-table/buses-from-medinipur"' bus-time-table/buses-from-medinipur.html
          grep -q '"khatra": {' scripts/gen_stand_v2.py
          grep -q '"medinipur": {' scripts/gen_stand_v2.py
          test "$(grep -c '<div class="tg-card">' bus-time-table/buses-from-khatra.html)" = "4"
          test "$(grep -c '<div class="tg-card">' bus-time-table/buses-from-manbazar.html)" = "3"
          test "$(grep -c '<div class="tg-card">' bus-time-table/buses-from-medinipur.html)" = "5"
