name: One-shot fix 2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch gen_route_v2 and commit
        run: |
          echo "$PATCH_B64" | base64 -d > patch_gen.py
          python3 patch_gen.py
          rm patch_gen.py
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_route_v2.py
          if git diff --cached --quiet; then
            echo "nothing to fix"
          else
            git commit -m "fix: hide nonsense >12h through-journey arrival/duration"
            git push
          fi
        env:
          PATCH_B64: 
