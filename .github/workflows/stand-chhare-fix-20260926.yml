name: Stand pages chhare fix 20260926
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Apply Bengali grammar fix chhara to chhare
        run: python3 -c "import base64; exec(base64.b64decode(''))"

      - name: Commit and push
        run: |
          git config user.name "busjatri-bot"
          git config user.email "action@busjatri.in"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "stand pages: Bengali grammar fix - chhara to chhare (72 pages + generators)"
            git push
          fi
