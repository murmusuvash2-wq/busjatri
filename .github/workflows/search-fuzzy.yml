name: Fuzzy stop search

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply fuzzy search patch
        run: python3 scripts/patch_search_fuzzy.py --write

      - name: Syntax check
        run: |
          node --check js/app.js
          node --check js/ux-fixes.js

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js js/ux-fixes.js
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fuzzy stop matching: spelling variants now match in search"
            git push
          fi
