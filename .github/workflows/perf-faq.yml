name: Performance + FAQ rollout

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rollout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply JS performance patches
        run: python3 scripts/apply_perf_fixes.py

      - name: Validate data
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          assert len(d['buses']) >= 3900, 'bus count dropped - aborting'
          print('OK', len(d['buses']), 'buses')
          EOF

      - name: Rebuild pages + client data
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js index.html bus-time-table sitemap.xml data/app-index.json data/bus-details.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Search perf (no 5MB download, debounced autocomplete) + data-driven FAQ on all route pages ($(date -u +%F))"
            git push
          fi
