name: Free geocode quality pass
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "all | suspects"
        default: "all"
        required: true
      limit:
        description: "Max stops to process (0 = no limit)"
        default: "300"
        required: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Run free geocode
        run: |
          MODE="${{ github.event.inputs.mode }}"
          LIMIT="${{ github.event.inputs.limit }}"
          ARGS=""
          if [ "$MODE" = "suspects" ]; then ARGS="--only-suspects"; fi
          if [ -n "$LIMIT" ] && [ "$LIMIT" != "0" ]; then ARGS="$ARGS --limit $LIMIT"; fi
          echo "Running: python3 scripts/geocode_stops_free.py $ARGS"
          python3 scripts/geocode_stops_free.py $ARGS
          python3 - <<'PY'
          import json
          r = json.load(open("data/geocode_report.json"))
          print("report:", {k: r.get(k) for k in ("filled","fixed","railway_attached","no_coord")})
          PY
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/geocode_stops_free.py data/stop_coords.json data/busjatri_data.json data/geocode_report.json || true
          git diff --staged --quiet || git commit -m "data: free geocode quality pass (Open-Meteo + Nominatim + rail snap)"
          git push
