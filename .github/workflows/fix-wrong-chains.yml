name: Wrong-chain buses fix (25 buses)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-wrong-chains:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Patch data (2 chains repaired from wbbus.in, 23 wrong chains removed)
        run: python3 scripts/fix_wrong_chains.py

      - name: Regenerate route pages
        run: python3 scripts/gen_route_v2.py --all

      - name: Regenerate stand pages
        run: python3 scripts/gen_stand_v2.py --all

      - name: Regenerate via-stop pages + sitemaps
        run: |
          python3 scripts/gen_via_stop_v2.py
          python3 scripts/patch_via_sitemap.py

      - name: Rebuild client search data
        run: python3 scripts/build_client_data.py

      - name: Validate
        run: |
          python3 - <<'PYEOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          byid = {b['id']: b for b in d['buses']}
          remove = ['bussathi-green-valley-238','bussathi-krishna-803','bussathi-tithy-834','bussathi-avijan-838','bussathi-krishna-gopal-862','bussathi-radha-damodar-864','bussathi-sahin-865','bussathi-western-diamond-869','bussathi-sbstc-870','bussathi-sbstc-871','bussathi-sbstc-872','bussathi-sbstc-873','bussathi-sbstc-875','bussathi-sbstc-874','bussathi-bhagyalaxmi-878','bussathi-arman-884','bussathi-green-valley-885','bussathi-gurjot-886','bussathi-laxmi-narayan-890','bussathi-maa-kali-893','bussathi-maa-sarada-895','bussathi-madan-mohan-897','bussathi-pally-duth-901']
          for i in remove:
              b = byid[i]
              assert b['stoppages'] == [], i
              assert b.get('total_stoppages') in (0, None), i
          ba = byid['wbbus-in-barnali-1266']
          assert [s['name'] for s in ba['stoppages']] == ['Neradeul', 'Chandrakona Town', 'Raskundu', 'Garhbeta'], ba['stoppages']
          assert ba['departure_time'] == '7:40 AM'
          hi = byid['wbbus-in-hilltop-super-1309']
          assert [s['name'] for s in hi['stoppages']] == ['Ajodhya Hills', 'Sirkabad', 'Aharara', 'Damda', 'Purulia'], hi['stoppages']
          assert hi['departure_time'] == '7:40 AM' and hi['arrival_time'] == '9:30 AM'
          print('data validation OK')
          PYEOF
          grep -q 'bussathi-pally-duth-901' data/app-index.json
          echo "validation OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data scripts/fix_wrong_chains.py bus-time-table via sitemap.xml sitemap-via.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Data audit fix: remove 23 wrong stoppage chains copied from other buses (source bussathi.in pages are broken); repair BARNALI + HILLTOP SUPER chains from wbbus.in"
            git push
          fi
