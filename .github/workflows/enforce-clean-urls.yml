name: Enforce clean URLs + prune thin pages

# Keeps every deployed page URL in clean (extensionless) form, noindexes +
# de-lists "via" stop pages that list fewer than 3 buses, and repoints the
# Kolkata city hub's route links so none 404. Runs after any push that changes
# pages or sitemaps, so a regeneration is corrected automatically.
#
# NOTE: the normalizing commit must NOT carry a "[skip ci]" marker. Cloudflare
# Workers Builds (the deploy path for this repo) honours skip-ci and would then
# skip the rebuild, leaving the corrected pages undeployed. Pushes made with the
# default GITHUB_TOKEN do not re-trigger this workflow, so there is no loop.

on:
  push:
    branches: [main]
    paths:
      - '**/*.html'
      - 'sitemap*.xml'
      - '_redirects'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enforce-clean-urls
  cancel-in-progress: false

jobs:
  enforce:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Normalize .html to clean URLs
        run: python3 scripts/fix_clean_urls.py

      - name: noindex + de-list thin via pages
        run: python3 scripts/prune_thin_via_pages.py

      - name: Repoint Kolkata city hub route links (no 404s)
        continue-on-error: true
        run: python3 scripts/fix_city_links.py --write

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "Already clean - nothing to commit."
            exit 0
          fi
          git config user.name "busjatri-bot"
          git config user.email "busjatri@zohomail.in"
          git add -A
          git commit -m "chore: normalize URLs + prune thin via pages + fix city hub links"
          git push
