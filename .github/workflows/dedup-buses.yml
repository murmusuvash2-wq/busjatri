name: Dedup buses

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dedup:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Remove duplicate buses
        run: python3 scripts/dedup_buses.py --write

      - name: Validate
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          n = len(d['buses'])
          assert 3900 <= n <= 4175, f'unexpected bus count {n}'
          print(f'OK: {n} buses')
          EOF

      - name: Rebuild pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/fix_am_pm.py
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Dedup: remove duplicate buses (cross-source + route variants) + rebuild"
            git push
          fi
