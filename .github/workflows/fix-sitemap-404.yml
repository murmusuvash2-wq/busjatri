name: Fix sitemap-city dead URLs — one-shot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Auto-fix dead sitemap-city locs
        run: |
          python3 - <<'PY'
          import os, re

          def exists(p):
              return (os.path.exists(p + '.html') or os.path.exists(p + '/index.html')
                      or os.path.exists(p) or p == '')

          rp, sp = '_redirects', 'sitemap-city.xml'
          red = open(rp, encoding='utf-8').read()
          sm = open(sp, encoding='utf-8').read()

          redir_src = set()
          for line in red.splitlines():
              line = line.strip()
              if not line or line.startswith('#'):
                  continue
              parts = line.split()
              if parts:
                  redir_src.add(parts[0])

          locs = re.findall(r'<loc>\s*(.*?)\s*</loc>', sm)
          dead = []
          for u in locs:
              p = u.replace('https://busjatri.in/', '').split('?')[0].rstrip('/')
              if exists(p):
                  continue
              if ('/' + p) in redir_src or ('/' + p + '.html') in redir_src:
                  continue
              dead.append((u, p))

          print(f"locs={len(locs)}  dead={len(dead)}")

          new_redirs, repointed, removed = [], 0, []
          for u, p in dead:
              d = os.path.dirname(p)
              slug = p.rsplit('/', 1)[-1]
              parts = slug.rsplit('-to-', 1)
              cands = []
              if len(parts) == 2:
                  a, c = parts
                  cands = [
                      f"{a}-to-{c}-station", f"{a}-station-to-{c}",
                      f"{a}-station-to-{c}-station", f"{a}-station-to-{c}-bus-stand",
                      f"{a}-station-to-{c}-depot", f"{a}-to-{c}-bus-stand",
                  ]
              tgt = next((t for t in cands if os.path.exists(f"{d}/{t}.html")), None)

              if tgt:
                  src_url = f"/{d}/{slug}"
                  dst_url = f"/{d}/{tgt}"
                  line = f"{src_url} {dst_url} 301"
                  if line not in red:
                      new_redirs.append(line)
                  before = sm
                  sm = sm.replace(f"https://busjatri.in/{d}/{slug}</loc>",
                                  f"https://busjatri.in/{d}/{tgt}</loc>")
                  sm = sm.replace(f"https://busjatri.in/{d}/{slug}.html</loc>",
                                  f"https://busjatri.in/{d}/{tgt}</loc>")
                  if sm != before:
                      repointed += 1
                  print(f"  REDIRECT {slug} -> {tgt}")
              else:
                  before = sm
                  sm = re.sub(rf"\s*<url>\s*<loc>{re.escape(u)}</loc>.*?</url>", "", sm, flags=re.S)
                  if sm == before:
                      sm = sm.replace(f"<loc>{u}</loc>", "")
                  removed.append(slug)
                  print(f"  REMOVE   {slug} (no matching page)")

          if new_redirs:
              if not red.endswith("\n"):
                  red += "\n"
              red += "# sitemap-city dead-URL fixes\n" + "\n".join(new_redirs) + "\n"
              open(rp, 'w', encoding='utf-8').write(red)
          open(sp, 'w', encoding='utf-8').write(sm)
          print(f"\nredirects added={len(new_redirs)}  locs repointed={repointed}  locs removed={len(removed)}")
          PY

      - name: Validate (no dead locs remain)
        run: |
          python3 - <<'EOF'
          import os, re
          def exists(p):
              return (os.path.exists(p + '.html') or os.path.exists(p + '/index.html')
                      or os.path.exists(p) or p == '')
          sm = open('sitemap-city.xml', encoding='utf-8').read()
          red = open('_redirects', encoding='utf-8').read()
          redir_src = {l.split()[0] for l in red.splitlines()
                       if l.strip() and not l.startswith('#') and l.split()}
          locs = re.findall(r'<loc>\s*(.*?)\s*</loc>', sm)
          bad = []
          for u in locs:
              p = u.replace('https://busjatri.in/', '').split('?')[0].rstrip('/')
              if exists(p) or ('/' + p) in redir_src:
                  continue
              bad.append(u)
          assert not bad, f"still dead: {bad[:8]}"
          print(f"OK: {len(locs)} locs, 0 dead | _redirects 301 rules: {red.count(' 301')}")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix dead sitemap-city URLs: 301 aliases to -station pages, drop unresolvable locs"
            git push
          fi
