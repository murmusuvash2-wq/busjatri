name: Fix 11 sitemap 404s (howrah-station slugs) — one-shot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Add 301 redirects + fix sitemap-city locs
        run: |
          python3 - <<'PY'
          import os, re

          PAIRS = [
              ("chetla-park-to-howrah", "chetla-park-to-howrah-station"),
              ("howrah-to-chetla-park", "howrah-station-to-chetla-park"),
              ("howrah-to-layalka", "howrah-station-to-layalka"),
              ("howrah-to-pardankuni", "howrah-station-to-pardankuni"),
              ("howrah-to-picnic-garden", "howrah-station-to-picnic-garden"),
              ("howrah-to-sarsuna", "howrah-station-to-sarsuna"),
              ("howrah-to-shibrampur", "howrah-station-to-shibrampur"),
              ("layalka-to-howrah", "layalka-to-howrah-station"),
              ("pardankuni-to-howrah", "pardankuni-to-howrah-station"),
              ("picnic-garden-to-howrah", "picnic-garden-to-howrah-station"),
              ("shibrampur-to-howrah", "shibrampur-to-howrah-station"),
          ]

          rp = '_redirects'
          red = open(rp, encoding='utf-8').read()
          added = 0
          lines = []
          for src, dst in PAIRS:
              assert os.path.exists(f"bus-time-table/{dst}.html"), f"target missing: {dst}"
              line = f"/bus-time-table/{src} /bus-time-table/{dst} 301"
              if line not in red:
                  lines.append(line)
                  added += 1
          if lines:
              if not red.endswith("\n"):
                  red += "\n"
              red += "# howrah-station slug fixes (dead /X-to-howrah aliases)\n" + "\n".join(lines) + "\n"
              open(rp, 'w', encoding='utf-8').write(red)
          print(f"_redirects: {added} redirects added")

          sp = 'sitemap-city.xml'
          sm = open(sp, encoding='utf-8').read()
          fixed = 0
          for src, dst in PAIRS:
              for pat in (f"https://busjatri.in/bus-time-table/{src}</loc>",
                          f"https://busjatri.in/bus-time-table/{src}.html</loc>"):
                  if pat in sm:
                      sm = sm.replace(pat, f"https://busjatri.in/bus-time-table/{dst}</loc>")
                      fixed += 1
          open(sp, 'w', encoding='utf-8').write(sm)
          print(f"sitemap-city.xml: {fixed} loc entries repointed")

          left = [s for s, _ in PAIRS if f"/bus-time-table/{s}</loc>" in sm or f"/bus-time-table/{s}.html</loc>" in sm]
          assert not left, f"still in sitemap: {left}"
          print("verify OK - no dead slugs left in sitemap-city.xml")
          PY

      - name: Validate
        run: |
          python3 - <<'EOF'
          import os, re
          sm = open('sitemap-city.xml', encoding='utf-8').read()
          red = open('_redirects', encoding='utf-8').read()
          locs = re.findall(r'<loc>\s*(.*?)\s*</loc>', sm)
          bad = []
          for u in locs:
              p = u.replace('https://busjatri.in/', '').split('?')[0].rstrip('/')
              if not (os.path.exists(p + '.html') or os.path.exists(p + '/index.html') or os.path.exists(p) or p == ''):
                  bad.append(u)
          assert not bad, f"sitemap still has 404s: {bad[:5]}"
          n = red.count(' 301')
          print(f"OK: sitemap-city.xml has {len(locs)} locs, 0 dead | _redirects has {n} 301 rules")
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix 11 sitemap-city 404s: 301 /X-to-howrah -> /X-to-howrah-station + repoint sitemap locs"
            git push
          fi
