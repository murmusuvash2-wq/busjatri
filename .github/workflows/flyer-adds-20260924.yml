name: Flyer adds 2026-09-24 (CB evening, Khargram route, time fixes)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flyer-adds:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Patch data (9 new buses + 2 time fixes)
        run: python3 scripts/patch_flyers_20260924.py

      - name: Regenerate route pages
        run: python3 scripts/gen_route_v2.py --all

      - name: Regenerate stand pages
        run: python3 scripts/gen_stand_v2.py --all

      - name: Regenerate via-stop pages + sitemaps
        run: |
          python3 scripts/gen_via_stop_v2.py
          python3 scripts/patch_via_sitemap.py

      - name: Rebuild client search data
        run: python3 scripts/build_client_data.py

      - name: Validate
        run: |
          grep -q 'nbstc-fb-cb-siliguri-800pm' data/busjatri_data.json
          grep -q 'sbstc-fb-kolkata-khargram-925am' data/busjatri_data.json
          grep -q 'sbstc-fb-medinipur-howrah-200pm' data/busjatri_data.json
          grep -q '8:00 PM' bus-time-table/cooch-behar-to-siliguri.html
          grep -q '8:45 PM' bus-time-table/cooch-behar-to-siliguri.html
          grep -q '1:30 PM' bus-time-table/cooch-behar-to-kolkata.html
          if grep -q '1:30 AM' bus-time-table/cooch-behar-to-kolkata.html; then echo "ERROR 1:30 AM still present"; exit 1; fi
          grep -q '8:25 AM' bus-time-table/haldia-to-karunamoyee.html
          if grep -q '8:45 AM' bus-time-table/haldia-to-karunamoyee.html; then echo "ERROR 8:45 AM still present"; exit 1; fi
          test -f bus-time-table/kolkata-to-khargram.html
          grep -q '9:25 AM' bus-time-table/kolkata-to-khargram.html
          grep -q 'Midnapur' bus-time-table/kolkata-to-khargram.html
          grep -q '2:00 PM' bus-time-table/medinipur-to-howrah.html
          grep -q 'Khargram' bus-time-table/buses-from-kolkata.html
          grep -q 'kolkata-to-khargram' sitemap.xml
          python3 - <<'PYEOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          buses = d['buses']
          assert len(buses) == 4108, len(buses)
          ids = {b['id'] for b in buses}
          for i in ['nbstc-fb-cb-siliguri-800pm','nbstc-fb-cb-siliguri-815pm','nbstc-fb-cb-siliguri-845pm',
                    'sbstc-fb-kolkata-khargram-730am','sbstc-fb-kolkata-khargram-825am',
                    'sbstc-fb-kolkata-khargram-925am','sbstc-fb-kolkata-khargram-245pm',
                    'sbstc-fb-kolkata-khargram-315pm','sbstc-fb-medinipur-howrah-200pm']:
              assert i in ids, i
          b = [x for x in buses if x['id']=='nbstc-in-nbstc-cooch-behar-ko-949'][0]
          assert b['departure_time'] == '1:30 PM'
          b = [x for x in buses if x['id']=='sbstc-haldia-kolkata-5'][0]
          assert b['departure_time'] == '8:25 AM'
          print('data validation OK')
          PYEOF
          echo "validation OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data scripts/patch_flyers_20260924.py bus-time-table via sitemap.xml sitemap-via.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Flyer batch 2026-09-24 - CB-Siliguri evening buses, Kolkata-Khargram route, Medinipur-Howrah 2PM, fix CB-Kolkata and Haldia-Karunamoyee times"
            git push
          fi
