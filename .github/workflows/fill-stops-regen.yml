name: Fill missing stoppages + regenerate pages

# One-shot: fill the buses that have no stoppages (WBTC intra-city PDF +
# sibling bus), rebuild the client data, then regenerate the route pages so the
# stoppages appear. Idempotent - safe to re-run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: python3 -m pip install --quiet pdfplumber pillow

      - name: Fill missing stoppages
        run: python3 scripts/fill_wbtc_stops.py

      - name: Rebuild client data
        run: python3 scripts/build_client_data.py

      - name: Regenerate route pages
        run: python3 scripts/gen_seo_pages.py

      - name: Restore Kolkata city design
        run: python3 scripts/build_city_route_pages.py

      - name: Unify header
        run: python3 scripts/unify_header_20261002.py

      - name: Strip header links + horizontal route map
        run: python3 scripts/simplify_route_pages.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fill missing stoppages (WBTC PDF + siblings) + regenerate pages"
            git pull --rebase origin main
            git push
          fi
