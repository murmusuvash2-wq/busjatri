name: Route page redesign
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore patch script (base64, unicode-safe)
        run: |
          echo '' | base64 -d > scripts/patch_route_redesign.py

      - name: Apply patch
        run: python3 scripts/patch_route_redesign.py

      - name: Validate source
        run: |
          python3 -m py_compile scripts/gen_seo_pages.py
          grep -q 'bd-link' scripts/gen_seo_pages.py
          grep -q 'rt20260920' scripts/gen_seo_pages.py
          grep -q 'route page redesign (2026-09-20)' css/seo.css

      - name: Regenerate pages
        env:
          SITE_BASE: https://busjatri.in
        run: python3 scripts/gen_seo_pages.py

      - name: Validate generated page
        run: |
          grep -q 'bd-link' bus-time-table/bankura-to-jhargram.html
          grep -q 'rt20260920' bus-time-table/bankura-to-jhargram.html
          grep -q 'depcol' bus-time-table/bankura-to-jhargram.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_seo_pages.py css/seo.css scripts/patch_route_redesign.py bus-time-table sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Route page redesign: modern bus cards + hero + timeline map"
            git push
          fi
