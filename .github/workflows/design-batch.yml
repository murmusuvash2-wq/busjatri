name: Design batch (compact + card-click + see-more)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  design-batch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Patch CSS + generator
        run: python3 scripts/patch_design_batch.py

      - name: Regenerate all route pages
        run: python3 scripts/gen_route_v2.py --all

      - name: Validate
        run: |
          grep -q 'design batch 2026-09-24' css/seo.css
          grep -q 'see-more-btn' scripts/gen_route_v2.py
          test -f bus-time-table/bagnan-to-karunamoyee.html
          grep -q 'see-more-btn' bus-time-table/bagnan-to-karunamoyee.html
          grep -q 'rt20260924' bus-time-table/bagnan-to-karunamoyee.html
          echo "validation OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add css/seo.css scripts/gen_route_v2.py scripts/patch_design_batch.py bus-time-table
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Design batch: compact route cards + card-click + See More (bilingual, Bengali numerals)"
            git push
          fi
