name: Add Apsara Siliguri-Kalimpong (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Append community entry (idempotent)
        run: |
          python3 - <<'PY'
          import json
          P = 'data/community_buses.json'
          c = json.load(open(P, encoding='utf-8'))

          bus = {
              "operator": "Apsara Bus Service",
              "bus_name": "Apsara Bus Service Siliguri-Kalimpong",
              "bus_type": "Private - NON AC",
              "reg_no": "",
              "origin": "Siliguri",
              "destination": "Kalimpong",
              "departure_time": "7:10 AM",
              "arrival_time": "10:15 AM",
              "route": "Siliguri - Kalimpong",
              "contact_number": "9064919130",
              "source": "apsarabus.in (operator route directory)",
              "detail_url": "",
              "service_note": "Apsara Bus Service. 2+2 Eicher, non-AC, 31 seats. About 3h 05m; fare approx Rs.270. Siliguri 7:10 AM to Kalimpong 10:15 AM.",
              "stops": [
                  {"name": "Siliguri", "up": "7:10 AM", "down": ""},
                  {"name": "Kalimpong", "up": "10:15 AM", "down": ""},
              ],
          }
          if not any(e.get('bus_name') == bus['bus_name'] for e in c['add']):
              c['add'].append(bus)
              print('appended')
          else:
              print('already present')
          json.dump(c, open(P, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('add:', len(c['add']), 'enrich:', len(c['enrich']))
          PY

      - name: Add community-reported buses
        run: python3 scripts/add_community_buses.py --write

      - name: Remove duplicates
        run: python3 scripts/dedup_buses.py --write

      - name: Validate
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          ids = {b['id'] for b in d['buses']}
          assert len(ids) >= 3900, 'bus count dropped'
          hit = [i for i in ids if i.startswith('apsara-bus-service-siliguri-kalimpong')]
          assert hit, 'Apsara bus missing'
          b = [x for x in d['buses'] if x['id'] == hit[0]][0]
          assert b.get('departure_time') == '7:10 AM', 'departure wrong'
          assert (b.get('operator') or '').lower().startswith('apsara'), 'operator wrong'
          print(f"OK: {len(ids)} buses; {hit[0]} dep={b['departure_time']}")
          EOF

      - name: Rebuild pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/fix_am_pm.py
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Community buses: add Apsara Bus Service Siliguri-Kalimpong (7:10 AM)"
            git push
          fi
