name: loading-ux-20260925
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply loading-ux patch
        run: python3 scripts/patch_loading_ux_20260925.py

      - name: Syntax check
        run: node --check js/app.js

      - name: Validate
        run: |
          set -e
          grep -q 'never make them wait for the full 1.9 MB index' js/app.js
          grep -q 'bj-ldr' js/app.js
          grep -q "focusin" js/app.js
          grep -q 'perf20260925e' index.html
          echo 'ALL VALIDATIONS PASSED'

      - name: Commit if changed
        run: |
          git config user.name "busjatri-bot"
          git config user.email "bot@busjatri.in"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Perf: bus pages load from own 1.5KB file (no 1.9MB wait); spinner for search pages; focusin kicks full-data fetch"
            git push
          fi
