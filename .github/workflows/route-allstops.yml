name: Route pages all-stops

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  allstops:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply all-stops patch
        run: python3 scripts/patch_route_allstops.py

      - name: Syntax check
        run: python3 -c "import py_compile; py_compile.compile('scripts/gen_route_v2.py', doraise=True)"

      - name: Regenerate ALL route pages
        run: python3 scripts/gen_route_v2.py --all

      - name: Validate
        run: |
          test -f bus-time-table/kolkata-to-digha.html
          if grep -q 'routemap' bus-time-table/kolkata-to-digha.html; then echo 'FAIL: routemap still present'; exit 1; fi
          N=$(grep -o 'via-chip' bus-time-table/kolkata-to-digha.html | wc -l)
          echo "kolkata-to-digha via-chips: $N"
          test "$N" -gt 100
          grep -q 'chip-row hscroll' bus-time-table/kolkata-to-digha.html
          grep -q 'route-slider.js' bus-time-table/kolkata-to-digha.html
          grep -q 'label-bn' bus-time-table/bankura-to-purulia.html
          echo "route pages still with routemap (old orphans): $(grep -l 'routemap' bus-time-table/*-to-*.html 2>/dev/null | grep -v -- '-via-' | wc -l)"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_route_v2.py scripts/patch_route_allstops.py bus-time-table/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            echo "staged files: $(git diff --cached --name-only | wc -l)"
            git commit -m "Route pages: remove Route Map; Via Stoppages = all stoppage names (hscroll + arrows)"
            git push
          fi
