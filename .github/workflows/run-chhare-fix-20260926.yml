name: Run chhare fix 20260926
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble patch script from parts
        run: |
          python3 - <<'PYEOF'
          import base64, gzip, hashlib, json, pathlib
          pdir = pathlib.Path('parts')
          man = json.load(open(pdir / 'manifest.json'))
          for out_path, rec in man.items():
              data = b''.join(base64.b64decode((pdir / p).read_text()) for p in rec['parts'])
              raw = gzip.decompress(data)
              assert hashlib.md5(raw).hexdigest() == rec['md5'], out_path + ' md5 mismatch'
              pathlib.Path(out_path).write_bytes(raw)
              print('assembled ' + out_path + ' (' + str(len(raw)) + ' bytes)')
          PYEOF

      - name: Run patch script
        run: python3 scripts/patch_chhare_20260926.py

      - name: Cleanup and commit
        run: |
          rm -rf parts
          git config user.name "busjatri-bot"
          git config user.email "action@busjatri.in"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "stand pages: Bengali grammar fix - chhara to chhare (72 pages + generators)"
            git push
          fi
