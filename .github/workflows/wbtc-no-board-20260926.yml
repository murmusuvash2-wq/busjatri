name: WBTC no departure board
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wbtc-no-board:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch (skip departure board for operators with no time data)
        run: python3 scripts/apply_wbtc_no_board.py

      - name: Regenerate operator pages
        run: python3 scripts/gen_operator_pages.py

      - name: Re-add GA4
        run: python3 scripts/add_ga4.py

      - name: Validate
        run: |
          ! grep -q 'bjLive' bus-time-table/wbtc-buses.html
          ! grep -q 'bjOpData' bus-time-table/wbtc-buses.html
          grep -q 'bjLive' bus-time-table/sbstc-buses.html
          grep -q 'bjLive' bus-time-table/nbstc-buses.html
          grep -q 'bjLive' bus-time-table/shyamoli-paribahan-buses.html
          grep -q 'How do I book' bus-time-table/wbtc-buses.html
          echo "validation OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts bus-time-table
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "WBTC page: remove empty departure board (no time data)"; git push; fi
