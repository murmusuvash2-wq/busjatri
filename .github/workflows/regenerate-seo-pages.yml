name: Regenerate SEO Pages

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'data/busjatri_data.json'
      - 'scripts/gen_seo_pages.py'
      - 'scripts/finalize_pages.py'
      - 'scripts/add_faq.py'
      - 'scripts/polish_route_pages.py'
      - 'scripts/add_ga4.py'
      - 'scripts/build_client_data.py'
      - 'scripts/strip_bilingual_faq.py'
      - 'scripts/fix_duplicate_faq_and_routes.py'
      - '.github/workflows/regenerate-seo-pages.yml'

concurrency:
  group: busjatri-main-push
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate SEO pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 design/build.py
          python3 app/build.py
          python3 scripts/gen_seo_pages.py
          python3 scripts/gen_stand_v2.py --all
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py
          python3 scripts/gen_reverse_routes.py --write
          python3 scripts/gen_stop_network.py --write
          python3 scripts/gen_blog.py --write
          # keep the route-guide FAQ, drop the bilingual duplicate
          python3 scripts/strip_bilingual_faq.py
          python3 scripts/fix_clean_urls.py
          python3 scripts/add_legal_links.py --write
          python3 scripts/add_consent_banner.py --write
          python3 scripts/bump_asset_versions.py

      - name: Verify exactly one FAQ block per route page
        run: |
          python3 - <<'EOF'
          import glob
          import os

          two_or_more = []
          guide_without_faq = []
          with_faq = 0

          for f in sorted(glob.glob('bus-time-table/*.html')):
              # demo/preview pages are not real route pages - ignore them
              if os.path.basename(f).startswith('demo-'):
                  continue
              h = open(f, encoding='utf-8', errors='ignore').read()
              if h.count('Frequently Asked Questions') >= 2:
                  two_or_more.append(f)
              if 'Bus Route Guide' in h and 'class="bj-faq"' not in h:
                  guide_without_faq.append(f)
              if 'class="bj-faq"' in h:
                  with_faq += 1

          print(f'pages with a visible FAQ (bj-faq): {with_faq}')
          print(f'pages with 2+ FAQ headings      : {len(two_or_more)}')
          print(f'route-guide pages missing FAQ   : {len(guide_without_faq)}')

          if two_or_more:
              raise SystemExit(f'duplicate FAQ on {len(two_or_more)} pages, e.g. {two_or_more[:3]}')
          if guide_without_faq:
              raise SystemExit(f'route guide without FAQ on {len(guide_without_faq)} pages, e.g. {guide_without_faq[:3]}')
          print('OK - exactly one FAQ per route page')
          EOF

      - name: Commit and push
        env:
          SITE_BASE: https://busjatri.in
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto: regenerate SEO pages — single FAQ per route page"
          # NOTE: do NOT add a [skip ci] marker here. Cloudflare Workers
          # Builds honours it and skips the rebuild, so the regenerated
          # HTML would never reach the live site (this is what left the
          # site serving stale pages). GITHUB_TOKEN pushes do not
          # re-trigger this workflow, so there is no loop.
          bash scripts/push_retry.sh
