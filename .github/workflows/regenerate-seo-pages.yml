name: Regenerate SEO Pages

on:
  workflow_dispatch:  # Manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths:
      - 'data/busjatri_data.json'
      - 'scripts/apply_ux_fixes.py'
      - 'scripts/gen_seo_pages.py'
      - 'scripts/finalize_pages.py'
      - 'scripts/add_faq.py'
      - 'scripts/polish_route_pages.py'
      - 'scripts/add_ga4.py'
      - 'scripts/build_client_data.py'
      - '.github/workflows/regenerate-seo-pages.yml'

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Apply UX fixes patch
        run: python3 scripts/apply_ux_fixes.py

      - name: Regenerate SEO pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/gen_seo_pages.py
          python3 scripts/gen_stand_v2.py --all
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py
          python3 scripts/gen_reverse_routes.py --write
          python3 scripts/gen_stop_network.py --write
          python3 scripts/gen_blog.py --write
          python3 scripts/fix_clean_urls.py

      - name: Commit and push
        env:
          SITE_BASE: https://busjatri.in
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "Auto: regenerate SEO pages — +single-bus routes, Time N/A, bn toggle [skip ci]"
          git push
