name: Fill missing bus times

on:
  workflow_dispatch:
    inputs:
      crawl:
        description: 'Also crawl wbbustime.in for more times'
        default: 'false'
      dry_run_crawl:
        description: 'true = crawl report only, no fills applied'
        default: 'true'
  schedule:
    - cron: '0 2 * * 4'   # every Thursday 07:30 IST

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Fill from own stoppage data (offline, safe)
        run: python3 scripts/fill_missing_times.py --write

      - name: Crawl wbbustime.in
        if: ${{ github.event.inputs.crawl == 'true' || github.event_name == 'schedule' }}
        run: |
          DRY="${{ github.event.inputs.dry_run_crawl }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then DRY=false; fi
          if [ "$DRY" = "false" ]; then
            python3 scripts/fill_missing_times.py --crawl --write
          else
            python3 scripts/fill_missing_times.py --crawl --dry-run
          fi

      - name: Validate
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          n = len(d['buses'])
          have = sum(1 for b in d['buses'] if b.get('departure_time'))
          assert n >= 3900, f'bus count dropped to {n} - aborting'
          print(f'OK: {n} buses, {have} with times, {n-have} still missing')
          EOF

      - name: Rebuild pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/fix_am_pm.py
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/busjatri_data.json bus-time-table sitemap.xml data/app-index.json data/bus-details.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fill missing bus times from stoppage data + crawl ($(date -u +%F))"
            git push
          fi
