name: Fix Kolkata city hub "View timetable" links

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild the LINKS map so every card points at a real page
        run: python3 scripts/fix_city_links.py --write

      - name: Validate - no link may 404
        run: |
          python3 - <<'EOF'
          import json, re, pathlib
          base = pathlib.Path('.')
          h = (base / 'kolkata-city-bus-timetable.html').read_text(encoding='utf-8')
          links = json.loads(re.search(r'(?:var|const|let)\s+LINKS\s*=\s*(\{.*?\});', h, re.DOTALL).group(1))
          bad = []
          for rn, url in links.items():
              if url.startswith('bus-time-table/') and url != 'bus-time-table/':
                  if not (base / url).exists():
                      bad.append((rn, url))
          assert not bad, f'{len(bad)} links still point at missing files: {bad[:5]}'
          n_page = sum(1 for u in links.values() if u != 'bus-time-table/')
          print(f'OK: {len(links)} links, {n_page} to real pages, {len(links)-n_page} to hub fallback, 0 broken')
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fix_city_links.py kolkata-city-bus-timetable.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Fix Kolkata city hub: View-timetable links pointed at renamed route pages (404) - repoint to existing pages"
            git push
          fi
