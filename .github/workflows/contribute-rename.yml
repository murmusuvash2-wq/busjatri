name: Contribute rename
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Rename footer link
        run: python3 scripts/patch_contribute_rename.py

      - name: Validate
        run: |
          grep -q 'Bus Contribution</a>' index.html
          grep -q 'bEmail' contribute.html
          grep -q 'Bus Contribution' contribute.html
          python3 - << 'PY'
          s = open('contribute.html', encoding='utf-8').read()
          bn = sum(1 for c in s if '\u0980' <= c <= '\u09ff')
          assert bn > 30, 'Bengali text missing: %d' % bn
          print('OK, Bengali chars:', bn)
          PY
          echo "all checks passed"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Footer: rename link to Bus Contribution"
            git push
          fi
