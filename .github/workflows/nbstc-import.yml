name: Import official NBSTC timetable + regenerate pages

# One-shot. Applies data/nbstc_cooch_behar_official.csv (the official NBSTC
# Cooch Behar route list, 459 trips) to data/busjatri_data.json and rebuilds the
# pages that read it. Idempotent — safe to re-run.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Import the official NBSTC trips
        run: python3 scripts/import_nbstc_official.py

      - name: Regenerate bus-time-table pages
        timeout-minutes: 15
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Unify header + repair malformed hrefs
        timeout-minutes: 8
        run: |
          python3 scripts/unify_header_20261002.py
          python3 scripts/fix_stray_quotes.py

      - name: Sanity checks
        run: |
          test $(ls bus-time-table/*.html | wc -l) -gt 300
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          python3 - <<'PY'
          import json
          d = json.load(open('data/busjatri_data.json', encoding='utf-8'))
          buses = d['buses'] if isinstance(d['buses'], list) else list(d['buses'].values())
          n = sum(1 for b in buses if (b.get('operator') or '').lower() == 'nbstc')
          print('NBSTC buses in data:', n)
          assert n >= 490, n
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bus-time-table via blog ./*.html sitemap.xml robots.txt \
                  data/busjatri_data.json data/stop_coords.json data/app-index.json \
                  data/bus-details.json data/nbstc_cooch_behar_official.csv
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "data(nbstc): import official Cooch Behar timetable + regen pages"
            git push
          fi
