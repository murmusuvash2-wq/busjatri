name: Route map destination fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply route-map patch (show origin + destination always)
        run: python3 scripts/patch_routemap.py

      - name: Syntax check
        run: python3 -c "import py_compile; py_compile.compile('scripts/gen_seo_pages.py', doraise=True)"

      - name: Regenerate all route pages
        run: python3 scripts/gen_route_v2.py --all

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_seo_pages.py scripts/patch_routemap.py css/seo.css bus-time-table/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Route map: always show origin + destination (first 8, gap, last 2 stops)"
            git push
          fi
