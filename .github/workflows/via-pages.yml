name: Via route pages v2 redesign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  via-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate via pages (new design)
        run: python3 scripts/gen_via_v2.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_via_v2.py bus-time-table
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Via pages v2: 3-place route line, correct onward stop times, Board-at-via section, clean EN/BN i18n (69 pages)"
            git push
          fi
