name: Operator pages redesign 20260925
on:
  workflow_dispatch:

jobs:
  opages:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble files from gzip parts
        run: |
          set -e
          python3 - <<'PYEOF'
          import base64, gzip, hashlib, json, pathlib
          pdir = pathlib.Path('parts')
          fixes = json.load(open(pdir / 'fixes.json')) if (pdir / 'fixes.json').exists() else {}
          def chunk(name):
              s = open(pdir / name).read()
              for pos, ch in fixes.get(name, []):
                  s = s[:pos] + ch + s[pos + 1:]
              return s
          man = json.load(open(pdir / 'manifest.json'))
          for out_path, rec in man.items():
              data = ''.join(chunk(p) for p in rec['parts'])
              raw = gzip.decompress(base64.b64decode(data))
              assert hashlib.md5(raw).hexdigest() == rec['md5'], out_path + ' md5 mismatch'
              pathlib.Path(out_path).write_bytes(raw)
              print('assembled ' + out_path + ' (' + str(len(raw)) + ' bytes)')
          PYEOF
          node --check js/op-board.js
          node --check js/stop-search-all.js
          python3 -c "import ast; ast.parse(open('scripts/gen_operator_pages.py').read())"
          rm -rf parts

      - name: Regenerate operator pages
        run: python3 scripts/gen_operator_pages.py

      - name: Validate
        run: |
          set -e
          for f in sbstc nbstc wbtc shyamoli-paribahan volvo-ac; do
            p="bus-time-table/$f-buses.html"
            grep -q 'bj-op-search' "$p"
            grep -q 'bjLive' "$p"
            grep -q 'op-faq' "$p"
            grep -q 'op-board.js' "$p"
            grep -q 'bjOpCfg' "$p"
            ! grep -q 'Buses buses' "$p"
          done
          grep -q 'stop-search-all.js?v=bj20260925b' index.html
          grep -q 'bookChip' js/stop-search-all.js
          echo "validation passed"

      - name: Commit and push
        run: |
          git config user.name "busjatri-bot"
          git config user.email "action@busjatri.in"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "operator pages: search card + depo board + booking links (assembled)"
            git push
          fi
