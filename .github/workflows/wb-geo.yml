name: Build place registry (data/places)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * 1"

permissions:
  contents: write

jobs:
  places:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build places.json
        run: python3 scripts/build_places.py
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/places/places.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "data(places): rebuild the place registry"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push || git push || git push
