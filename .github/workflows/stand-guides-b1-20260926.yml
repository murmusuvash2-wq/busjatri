          def en_block(st):
              lines = []
              lines.append("    %s: {" % esc(st["slug"]))
              lines.append("        \"intro\": (%s, %s)," % (esc(st["intro"][0]), esc(st["intro"][1])))
              lines.append("        \"note\": %s," % esc(st["note_en"]))
              lines.append("        \"cards\": [")
              for c in st["cards"]:
                  parts = ["\"icon\": %s" % esc(c["icon"]), "\"name\": %s" % esc(c["name"]), "\"bn\": %s" % esc(c["bn"])]
                  lines.append("            {%s," % ", ".join(parts))
                  lines.append("             \"desc\": %s," % esc(c["desc_en"]))
                  lines.append("             \"bus\": %s," % esc(c["bus_en"]))
                  lines.append("             \"maps\": %s," % esc(c["maps"]))
                  lines.append("             \"why\": %s," % esc(c["why_en"]))
                  lines.append("             \"when\": %s," % esc(c["when_en"]))
                  if "stay" in c:
                      lines.append("             \"stay\": %s}," % esc(c["stay"]))
                  else:
                      lines.append("             \"stay\": None, \"stay_extra\": %s, \"stay_link\": %s, \"stay_text\": %s}," % (
                          esc(c["stay_extra_en"]), esc(c["stay_link_en"]), esc(c["stay_text_en"])))
              lines.append("        ],")
              lines.append("    },")
              return "\n".join(lines)

          def bn_block(st):
              lines = []
              lines.append("    %s: {" % esc(st["slug"]))
              lines.append("        \"note\": %s," % esc(st["note_bn"]))
              lines.append("        \"cards\": [")
              for c in st["cards"]:
                  parts = ["\"desc_bn\": %s" % esc(c["desc_bn"]), "\"bus_bn\": %s" % esc(c["bus_bn"]),
                           "\"why_bn\": %s" % esc(c["why_bn"]), "\"when_bn\": %s" % esc(c["when_bn"])]
                  if "stay_extra_bn" in c:
                      parts.append("\"stay_extra_bn\": %s" % esc(c["stay_extra_bn"]))
                      parts.append("\"stay_text_bn\": %s" % esc(c["stay_text_bn"]))
                  lines.append("            {%s}," % ", ".join(parts))
              lines.append("        ],")
              lines.append("    },")
              return "\n".join(lines)

          EN = "\n".join(en_block(s) for s in STANDS)
          BN = "\n".join(bn_block(s) for s in STANDS)

          SCRIPT = '''
          #!/usr/bin/env python3
          """Add travel guides for Bishnupur, Jhargram and Bolpur stand pages.

          Batch 1 of stand-page travel guides (Murmu-approved 2026-09-26). Adds
          three entries to GUIDES and three matching entries to GUIDES_BN in
          scripts/gen_stand_v2.py. Facts verified against WB Tourism and the
          Bankura/Jhargram district administration sites; bus lines are from
          the BusJatri dataset. Idempotent: re-running does nothing if the
          slug 'jhargram' is already present in GUIDES.
          """
          import io

          PATH = "scripts/gen_stand_v2.py"

          EN_BLOCK = r"""@@EN@@"""

          BN_BLOCK = r"""@@BN@@"""

          A1 = "\\n}\\n\\n\\n\\nGUIDES_BN = {"
          A2 = "\\n}\\n\\n\\ndef _merge_guide_bn():"


          def main():
              with io.open(PATH, encoding="utf-8") as f:
                  src = f.read()
              if '"jhargram": {' in src:
                  print("already patched - nothing to do")
                  return
              assert src.count(A1) == 1, "GUIDES end anchor not found"
              assert src.count(A2) == 1, "GUIDES_BN end anchor not found"
              src = src.replace(A1, "\\n" + EN_BLOCK.rstrip() + "\\n}\\n\\n\\n\\nGUIDES_BN = {")
              src = src.replace(A2, "\\n" + BN_BLOCK.rstrip() + "\\n}\\n\\n\\ndef _merge_guide_bn():")
              with io.open(PATH, "w", encoding="utf-8") as f:
                  f.write(src)
              print("patched gen_stand_v2.py: +bishnupur, +jhargram, +bolpur guides")


          if __name__ == "__main__":
              main()
          '''.replace("@@EN@@", EN).replace("@@BN@@", BN)
          # the SCRIPT template above is indented for the heredoc; dedent it now
          import textwrap
          SCRIPT = textwrap.dedent(SCRIPT)
          ast.parse(SCRIPT)
          assert all(ord(ch) < 128 for ch in SCRIPT), "patch script must be pure ascii"

          with io.open("scripts/apply_stand_guides_batch1.py", "w", encoding="utf-8") as f:
              f.write(SCRIPT)
          print("wrote scripts/apply_stand_guides_batch1.py:", len(SCRIPT), "bytes")
          r = subprocess.run([sys.executable, "scripts/apply_stand_guides_batch1.py"])
          sys.exit(r.returncode)
          B1EOF

      - name: Validate generator
        run: |
          python3 -c "import ast; ast.parse(open('scripts/gen_stand_v2.py', encoding='utf-8').read())"
          grep -q '"jhargram": {' scripts/gen_stand_v2.py
          grep -q '"bolpur": {' scripts/gen_stand_v2.py
          echo "generator OK"

      - name: Regenerate 3 stand pages
        run: python3 scripts/gen_stand_v2.py --stands "Bishnupur,Jhargram,Bolpur"

      - name: Re-add GA4
        run: python3 scripts/add_ga4.py

      - name: Validate pages
        run: |
          test "$(grep -c '<div class="tg-card">' bus-time-table/buses-from-bishnupur.html)" -ge 4
          test "$(grep -c '<div class="tg-card">' bus-time-table/buses-from-jhargram.html)" -ge 3
          test "$(grep -c '<div class="tg-card">' bus-time-table/buses-from-bolpur.html)" -ge 3
          grep -q 'G-L4E3D1YX9X' bus-time-table/buses-from-bishnupur.html
          grep -q 'G-L4E3D1YX9X' bus-time-table/buses-from-jhargram.html
          grep -q 'G-L4E3D1YX9X' bus-time-table/buses-from-bolpur.html
          grep -q 'DEY TRAVELS' bus-time-table/buses-from-bishnupur.html
          grep -q 'ভ্রমণ গাইড' bus-time-table/buses-from-jhargram.html
          grep -q 'ভ্রমণ গাইড' bus-time-table/buses-from-bolpur.html
          echo "validation OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts bus-time-table
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "Stand guides batch 1: travel guides for Bishnupur, Jhargram, Bolpur (EN+BN)"
            git push
          fi
