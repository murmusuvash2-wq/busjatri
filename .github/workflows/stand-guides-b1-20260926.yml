          import ast, io, subprocess, sys

          def esc(s):
              out = ['"']
              for ch in s:
                  o = ord(ch)
                  if ch == '"': out.append('\\"')
                  elif ch == '\\': out.append('\\\\')
                  elif o < 128: out.append(ch)
                  elif o <= 0xFFFF: out.append('\\u%04x' % o)
                  else: out.append('\\U%08x' % o)
              out.append('"')
              return ''.join(out)

