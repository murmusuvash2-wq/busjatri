name: SEO v2 stand pages

on:
  workflow_dispatch:
    inputs:
      stands:
        description: "Comma list of stand names (empty = all 72)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble generator from parts
        if: hashFiles('scripts/stand_parts/p00.txt') != ''
        run: |
          cat scripts/stand_parts/p*.txt | tr -d '\n' | base64 -d > scripts/gen_stand_v2.py
          GOT=$(git hash-object scripts/gen_stand_v2.py)
          echo "assembled sha: $GOT (want 01da1bedd394388d4c1fa497e205b86cee10cb70)"
          [ "$GOT" = "01da1bedd394388d4c1fa497e205b86cee10cb70" ] || { echo 'ASSEMBLED FILE MISMATCH - aborting'; exit 1; }
          python3 -c "import ast; ast.parse(open('scripts/gen_stand_v2.py').read())"

      - name: Generate stand pages
        run: |
          if [ -n "${{ github.event.inputs.stands }}" ]; then
            python3 scripts/gen_stand_v2.py --stands "${{ github.event.inputs.stands }}"
          else
            python3 scripts/gen_stand_v2.py --all
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_stand_v2.py bus-time-table/buses-from-*.html
          if [ -d scripts/stand_parts ]; then git rm -r -q scripts/stand_parts; fi
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SEO v2: regenerate stand pages (buses-from-X) in v2 design"
            git push
          fi
