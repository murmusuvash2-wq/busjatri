name: Enrich Kalika + S Travels (one-shot)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Upsert enrich entries (idempotent)
        run: |
          python3 - <<'PY'
          import json
          P = 'data/community_buses.json'
          c = json.load(open(P, encoding='utf-8'))
          D = json.load(open('data/busjatri_data.json', encoding='utf-8'))

          def upsert(target, fields):
              for e in c['enrich']:
                  if e.get('target_id') == target:
                      e.update(fields)
                      return 'updated'
              c['enrich'].append(dict(target_id=target, **fields))
              return 'appended'

          # Kalika: insert the timed stop Ankhuta More + replacement note
          b = [x for x in D['buses'] if x['id'] == 'bussathi-kalika-313']
          if b:
              stops = []
              for s in b[0]['stoppages']:
                  stops.append({"name": s['name'], "up": s.get('up_time', ''), "down": s.get('down_time', '')})
                  if s['name'] == 'Khatra':
                      stops.append({"name": "Ankhuta More", "up": "8:40 AM", "down": "1:30 PM"})
              print('kalika:', upsert('bussathi-kalika-313', {
                  "source": "facebook (community report)",
                  "service_note": "Kalika. Replacement vehicle for WB 55A 1329 (new bus in service); listed reg is the older vehicle. Regular service, all seasons.",
                  "stoppages": [{"no": i + 1, "name": x["name"], "up_time": x["up"], "down_time": x["down"]} for i, x in enumerate(stops)],
              }))
          else:
              print('kalika: target not found')

          print('s-travels:', upsert('bussathi-s-travels-661', {
              "source": "facebook (community report)",
              "service_note": "S Travels. AL Lynx Strong BS6. Regular service (all seasons).",
          }))

          json.dump(c, open(P, 'w', encoding='utf-8'), ensure_ascii=False, indent=1)
          print('enrich entries:', len(c['enrich']))
          PY

      - name: Add community-reported buses
        run: python3 scripts/add_community_buses.py --write

      - name: Remove duplicates
        run: python3 scripts/dedup_buses.py --write

      - name: Validate
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          ids = {b['id'] for b in d['buses']}
          assert len(ids) >= 3900, 'bus count dropped'
          k = [x for x in d['buses'] if x['id'] == 'bussathi-kalika-313'][0]
          names = [s['name'] for s in k['stoppages']]
          assert 'Ankhuta More' in names, 'Ankhuta More not inserted'
          assert k['stoppages'][names.index('Ankhuta More')]['up_time'] == '8:40 AM', 'Ankhuta time wrong'
          s = [x for x in d['buses'] if x['id'] == 'bussathi-s-travels-661'][0]
          assert s.get('service_note'), 's-travels note missing'
          print(f"OK: {len(ids)} buses; Kalika stops={len(k['stoppages'])} (Ankhuta More added)")
          EOF

      - name: Rebuild pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/fix_am_pm.py
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Enrich Kalika (add Ankhuta More + replacement note) and S Travels note"
            git push
          fi
