name: Admin sections restructure
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_admin_sections.py

      - name: Validate
        run: |
          grep -q 'view-newbuses' admin.html
          grep -q 'view-issues' admin.html
          grep -q 'loadNewBuses' admin.html
          grep -q 'findDup' admin.html
          grep -q 'fmtTime' admin.html
          grep -q 'add_community_buses' .github/workflows/apply-overrides.yml
          python3 - << 'PY'
          import re, io
          s = io.open('admin.html', encoding='utf-8').read()
          scripts = re.findall(r'<script>(.*?)</script>', s, re.S)
          io.open('/tmp/inline.js', 'w', encoding='utf-8').write('\n;\n'.join(scripts))
          PY
          node --check /tmp/inline.js
          echo 'all checks passed'

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/apply-overrides.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Admin: 3 sections (time/issues/new buses) + dup detection + AM/PM"
            git push
          fi
