name: Home board grace 10min 20260926
on:
  workflow_dispatch:

jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble patch script from parts
        run: |
          python3 - <<'PYEOF'
          import base64, gzip, hashlib, json, pathlib
          pdir = pathlib.Path('parts')
          man = json.load(open(pdir / 'manifest.json'))
          for out_path, rec in man.items():
              data = b''.join(base64.b64decode((pdir / p).read_text()) for p in rec['parts'])
              raw = gzip.decompress(data)
              assert hashlib.md5(raw).hexdigest() == rec['md5'], out_path + ' md5 mismatch'
              pathlib.Path(out_path).write_bytes(raw)
              print('assembled ' + out_path + ' (' + str(len(raw)) + ' bytes)')
          PYEOF

      - name: Patch and validate
        run: |
          python3 scripts/patch_home_grace.py
          grep -c '< -10)' js/ux-fixes.js
          grep -q 'ux-fixes.js?v=rpt20260926b' index.html
          if grep -q '< -30)' js/ux-fixes.js; then echo 'ERROR: -30 still present'; exit 1; fi
          node --check js/ux-fixes.js
          echo 'validation OK: 3x -10, buster rpt20260926b, node check pass'

      - name: Cleanup and commit
        run: |
          rm -rf parts
          git config user.name "busjatri-bot"
          git config user.email "action@busjatri.in"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "home board: past-bus grace 30 min -> 10 min for real-time feel"
            git push
          fi
