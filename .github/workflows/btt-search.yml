name: BTT hub search box (From / via / To / Bus Stand)
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  btt-search:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply BTT search patch to generator
        run: python3 scripts/patch_btt_search.py

      - name: Regenerate BTT hub page
        run: python3 scripts/gen_btt_v2.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/patch_btt_search.py scripts/gen_btt_v2.py bus-time-table/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "BTT hub: From/via/To/Bus Stand search box + compact hero + clean EN/BN i18n"
            git push
          fi
