name: Orphan pages v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch generator (orphan support)
        run: |
          echo "$PATCH_B64" | base64 -d > patch_gen.py
          python3 patch_gen.py
          rm patch_gen.py

      - name: Generate orphan route pages
        run: python3 scripts/gen_route_v2.py --orphans

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_route_v2.py bus-time-table/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SEO v2: regenerate 467 orphan route pages (through-services revive them)"
            git push
          fi
        env:
          PATCH_B64: 
