name: SEO v2 orphan pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate orphan route pages
        run: python3 scripts/gen_orphans.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_orphans.py bus-time-table/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SEO v2: regenerate orphan route pages (through-services revive them)"
            git push
          fi
