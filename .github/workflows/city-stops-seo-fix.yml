name: Kolkata city bus stops + SEO interlinking + bilingual fixes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_city_stops_seo.py'

permissions:
  contents: write

jobs:
  city-stops-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fill STOPS/LEGS on 58 city route pages + journey panels + interlinking
        run: python3 scripts/patch_city_stops_seo.py --write

      - name: Validate
        run: |
          python3 - <<'EOF'
          import re, json
          from pathlib import Path
          hub = Path('kolkata-city-bus-timetable.html').read_text(encoding='utf-8')
          m = re.search(r'var LINKS=(\{.*?\});', hub, re.S)
          assert m, 'Kolkata city hub LINKS missing'
          links = json.loads(m.group(1))
          assert len(links) == 73, f'expected 73 linked WBTC routes, found {len(links)}'
          missing = []
          bad = []
          for route, rel in links.items():
              p = Path(rel)
              if not p.exists():
                  missing.append((route, rel)); continue
              h = p.read_text(encoding='utf-8')
              if 'v12 time-rail' not in h or 'var TRIPS' not in h:
                  bad.append((route, rel, 'rail/trips'))
              if 'city-i18n-v1' not in h:
                  bad.append((route, rel, 'bilingual-runtime'))
              sm = re.search(r'var STOPS=(\[.*?\]);', h, re.S)
              if sm and sm.group(1).strip() != '[]' and 'city-stops-v1' not in h:
                  bad.append((route, rel, 'static-stops'))
          assert not missing, f'missing city route pages: {missing[:5]}'
          assert not bad, f'city route validation failures: {bad[:10]}'
          print(f'validation OK: {len(links)} Kolkata City Bus routes; rail + bilingual toggle checked')
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/patch_city_stops_seo.py bus-time-table/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: stop-wise data on all 58 empty city route pages (journey panels), static stop lists, related-route links, BTT hub + stand interlinking"
            git push
          fi
