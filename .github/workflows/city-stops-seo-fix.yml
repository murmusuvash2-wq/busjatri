name: Kolkata city bus stops + SEO interlinking + bilingual fixes
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/patch_city_stops_seo.py'
      - 'kolkata-city-bus-timetable.html'

permissions:
  contents: write

jobs:
  city-stops-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore the 73 Kolkata WBTC route pages
        run: |
          python3 - <<'EOF'
          import json, re, subprocess
          REF = 'c1d8657bd8ca2469b39691e997e65f644cd20223'
          hub = subprocess.check_output(['git','show',f'{REF}:kolkata-city-bus-timetable.html'], text=True)
          links = json.loads(re.search(r'var LINKS=(\\{.*?\\});', hub, re.S).group(1))
          assert len(links) == 73
          for path in links.values():
              if path.endswith('.html'):
                  subprocess.run(['git','checkout',REF,'--',path], check=True)
          print('restored', sum(p.endswith('.html') for p in links.values()), 'route pages')
          EOF

      - name: Fill STOPS/LEGS on 58 city route pages + journey panels + interlinking
        run: python3 scripts/patch_city_stops_seo.py --write

      - name: Validate
        run: |
          python3 - <<'EOF'
          import re, json
          from pathlib import Path
          hub = Path('kolkata-city-bus-timetable.html').read_text(encoding='utf-8')
          links = json.loads(re.search(r'var LINKS=(\{.*?\});', hub, re.S).group(1))
          assert len(links) == 73, f'expected 73 routes, found {len(links)}'
          bad = []
          for route, rel in links.items():
              p = Path(rel)
              if not p.exists():
                  bad.append((route, rel, 'missing')); continue
              h = p.read_text(encoding='utf-8')
              if 'v12 time-rail' not in h or 'var TRIPS' not in h:
                  bad.append((route, rel, 'rail/trips'))
              if 'city-i18n-v1' not in h:
                  bad.append((route, rel, 'bilingual-toggle'))
          assert not bad, f'city route validation failures: {bad[:10]}'
          print(f'validation OK: {len(links)} Kolkata WBTC route pages have rail + bilingual toggle')
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/patch_city_stops_seo.py bus-time-table/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "feat: stop-wise data on all 58 empty city route pages (journey panels), static stop lists, related-route links, BTT hub + stand interlinking"
            git push
          fi
