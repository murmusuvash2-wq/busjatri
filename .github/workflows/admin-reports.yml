name: Admin reports panel upgrade
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Upgrade reports section
        run: python3 scripts/patch_admin_reports.py

      - name: Validate
        run: |
          python3 - << 'PY'
          import re
          h = open('admin.html', encoding='utf-8').read()
          m = re.search(r'<script>(.*?)</script>', h, re.S)
          js = m.group(1)
          assert js.rstrip().endswith('})();'), 'main script truncated'
          assert 'rptAction' in js and 'setRtok' in js and 'bj_rpt_token' in js, 'reports code missing'
          open('/tmp/main.js', 'w', encoding='utf-8').write(js)
          print('extraction OK, %d chars' % len(js))
          PY
          node --check /tmp/main.js
          echo "all checks passed"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Admin panel: live reports from Sheet with Approve/Reject buttons"
            git push
          fi
