name: Bus page UI fixes
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply bus UI patch
        run: python3 scripts/patch_bus_ui.py

      - name: Validate
        run: |
          node --check js/extras.js
          node --check js/bus-page.js
          node --check js/ux-fixes.js
          grep -q 'shareBusFacebook' js/extras.js
          grep -q 'shareBusFacebook' js/bus-page.js
          grep -q 'Thank you for contributing' js/ux-fixes.js
          grep -q 'js/extras.js?v=rpt20260920c' index.html
          python3 -c "s=open('index.html',encoding='utf-8').read(); assert '<html' in s and '</html>' in s; print('index.html OK')"
          echo "all checks passed"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/extras.js js/bus-page.js js/ux-fixes.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bus pages: bus-level report form (EN/BN), FB+WA full-stop share, thank-you toast"
            git push
          fi
