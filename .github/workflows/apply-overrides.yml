name: Apply time overrides
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Merge community bus contributions
        run: python3 scripts/add_community_buses.py --write

      - name: Merge admin time overrides into source data
        run: python3 scripts/apply_time_overrides.py

      - name: Validate
        run: |
          python3 - <<'EOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          n = len(d['buses'])
          assert n >= 3900, f'bus count dropped to {n} - aborting'
          print(f'OK: {n} buses')
          EOF

      - name: Rebuild pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/busjatri_data.json bus-time-table sitemap.xml data/app-index.json data/bus-details.json data/app-index-lite.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply admin time overrides + rebuild ($(date -u +%F))"
            git push
          fi
