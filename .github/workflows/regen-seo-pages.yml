name: Regenerate SEO pages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply patches (district browse + search + FAQ + via system)
        env:
          SITE_BASE: https://busjatri.in
        run: |
          if ! grep -q "district_section" scripts/gen_seo_pages.py; then
            python3 scripts/patches/patch_gen1.py
            python3 scripts/patches/patch_gen2.py
            python3 scripts/patches/patch_gen3.py
          fi
          if ! grep -q "def via_stops" scripts/gen_seo_pages.py; then
            python3 scripts/patches/patch_gen4.py
          fi
          if ! grep -q "viaInput" js/app.js; then
            python3 scripts/patches/patch_app_js.py
          fi

      - name: Generate og-image (social share card)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-beng-extra
          python3 -m pip install --quiet pillow
          python3 scripts/make_og_image.py

      - name: Attach railway stations (bbox filter + name matching)
        run: python3 scripts/add_railway_stations.py

      - name: Regenerate bus-time-table pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Unify header on every page (same header + toggle as the homepage)
        run: python3 scripts/unify_header_20261002.py

      - name: Validate
        run: |
          test $(ls bus-time-table/*.html | wc -l) -gt 300
          test $(ls bus-time-table/ | grep -c '\-via\-') -gt 100
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          grep -q "label-bn" bus-time-table/index.html
          grep -q "district-card" bus-time-table/index.html
          grep -q "routeSearch" bus-time-table/index.html
          test -s bus-time-table/search-index.json
          grep -q "label-bn" bus-time-table/asansol-to-digha.html
          grep -q "label-bn" bus-time-table/medinipur-to-digha-via-kharagpur.html
          ! grep -rq "var(--panel)" bus-time-table/
          python3 -c "from PIL import Image; Image.open('og-image.png').verify(); print('og-image OK')"

          # --- header must be identical everywhere: one control cluster, one controller ---
          for f in bus-time-table/asansol-to-digha.html bus-time-table/index.html via/adra.html \
                   index.html about.html 404.html contribute.html blog/how-to-find-bus-timings.html; do
            grep -q 'class="bj-nav"' "$f" || { echo "missing canonical header: $f"; exit 1; }
            grep -q 'id="langEn"' "$f" || { echo "missing EN button: $f"; exit 1; }
            grep -q 'id="langBn"' "$f" || { echo "missing Bengali button: $f"; exit 1; }
            grep -q 'id="themeBtn"' "$f" || { echo "missing theme button: $f"; exit 1; }
            grep -q 'js/hdr.js' "$f" || { echo "missing header controller: $f"; exit 1; }
          done
          if grep -rl --include='*.html' 'id="bjThemeBtn"' . ; then
            echo "legacy duplicate theme button still present"; exit 1
          fi
          echo "header OK on every page"

      - name: Commit and push if changed
        env:
          SITE_BASE: https://busjatri.in
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bus-time-table via blog ./*.html sitemap.xml robots.txt \
                  data/busjatri_data.json data/stop_coords.json \
                  scripts/gen_seo_pages.py scripts/unify_header_20261002.py js/app.js \
                  og-image.png data/app-index.json data/bus-details.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate SEO pages + unify header on every page"
            git push
          fi
