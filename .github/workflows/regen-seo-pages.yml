name: Regenerate SEO pages
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regen:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # NOTE (2026-10-04): the old "Apply patches" step (patch_gen1..4 + patch_app_js)
      # was removed. All four patch scripts now assert on anchors that no longer exist
      # in scripts/gen_seo_pages.py / js/app.js, so the step aborted the whole run
      # before generation. Their changes are already part of the current generator.

      - name: Generate og-image (social share card)
        timeout-minutes: 8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-beng-extra
          python3 -m pip install --quiet pillow
          python3 scripts/make_og_image.py

      # SKIP_GEOCODE=1 -> reuse data/stop_coords.json instead of calling Open-Meteo.
      # Without it this step sat on the network for 30 minutes and the whole job was
      # cancelled by its timeout, so no page ever got regenerated.
      - name: Attach railway stations (bbox filter + name matching)
        timeout-minutes: 6
        env:
          SKIP_GEOCODE: "1"
        run: python3 scripts/add_railway_stations.py

      - name: Regenerate bus-time-table pages
        timeout-minutes: 10
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Unify header on every page (same header + toggle as the homepage)
        timeout-minutes: 6
        run: python3 scripts/unify_header_20261002.py

      # Heals legacy href="X"" markup left by an old bug in fix_clean_urls.py
      # (lookahead did not consume the closing quote, the replacement re-added one).
      # Idempotent; exits non-zero if anything is still malformed.
      - name: Repair malformed hrefs (stray quote)
        timeout-minutes: 6
        run: python3 scripts/fix_stray_quotes.py

      - name: Validate
        run: |
          test $(ls bus-time-table/*.html | wc -l) -gt 300
          test $(ls bus-time-table/ | grep -c '\-via\-') -gt 50
          python3 -c "import xml.dom.minidom; xml.dom.minidom.parse('sitemap.xml')"
          ! grep -rq "var(--panel)" bus-time-table/
          python3 -c "from PIL import Image; Image.open('og-image.png').verify(); print('og-image OK')"

          # --- header must be identical everywhere: one control cluster, one controller ---
          for f in bus-time-table/index.html bus-time-table/asansol-to-digha.html via/adra.html \
                   index.html about.html 404.html contribute.html blog/how-to-find-bus-timings.html; do
            test -f "$f" || { echo "missing page: $f"; exit 1; }
            grep -q 'class="bj-nav"' "$f" || { echo "missing canonical header: $f"; exit 1; }
            grep -q 'id="langEn"' "$f" || { echo "missing EN button: $f"; exit 1; }
            grep -q 'id="langBn"' "$f" || { echo "missing Bengali button: $f"; exit 1; }
            grep -q 'id="themeBtn"' "$f" || { echo "missing theme button: $f"; exit 1; }
            grep -q 'js/hdr.js' "$f" || { echo "missing header controller: $f"; exit 1; }
          done
          if grep -rl --include='*.html' 'id="bjThemeBtn"' . ; then
            echo "legacy duplicate theme button still present"; exit 1
          fi
          echo "header OK on every page"

          # --- no malformed attribute values (stray quote) anywhere deployed ---
          if grep -rlE 'href="[^"]*""' --include='*.html' bus-time-table via blog ./*.html ; then
            echo "stray-quote hrefs still present"; exit 1
          fi
          echo "hrefs OK on every page"

      - name: Commit and push if changed
        env:
          SITE_BASE: https://busjatri.in
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bus-time-table via blog ./*.html sitemap.xml robots.txt \
                  data/busjatri_data.json data/stop_coords.json \
                  scripts/gen_seo_pages.py scripts/unify_header_20261002.py \
                  scripts/fix_stray_quotes.py scripts/fix_clean_urls.py js/app.js \
                  og-image.png data/app-index.json data/bus-details.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Regenerate SEO pages + unify header on every page"
            git push
          fi
