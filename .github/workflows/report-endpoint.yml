name: Report endpoint wiring
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Wire Apps Script endpoint
        run: python3 scripts/patch_report_endpoint.py

      - name: Validate
        run: |
          node --check js/extras.js
          grep -q 'AKfycbyf-rjtn606T1FUfGaPiYnyIMCZIU99ZlwqmkI3cVfPT0SarjTY12MZQpu2exLczdUD/exec' js/extras.js
          grep -q 'js/extras.js?v=rpt20260920b' index.html
          python3 -c "s=open('index.html',encoding='utf-8').read(); assert '<html' in s and '</html>' in s; print('index.html OK')"
          echo "all checks passed"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/extras.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Wire report receiver endpoint (Apps Script web app URL) + cache-bust"
            git push
          fi
