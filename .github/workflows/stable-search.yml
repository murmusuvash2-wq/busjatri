name: Stable search fix

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Apply stable search patch
        run: python3 scripts/patch_stable_search.py --write

      - name: Verify no lite/merge references left
        run: |
          if grep -q "loadFullIndex" js/app.js; then
            echo "ERROR: loadFullIndex still referenced"; exit 1
          fi
          node --check js/app.js
          echo "clean"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Search stability: single full index at load (stoppage search always works)"
            git push
          fi
