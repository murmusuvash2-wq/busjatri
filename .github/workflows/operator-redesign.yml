name: Operator page redesign
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Patch operator template
        run: |
          python3 - << 'PYEOF'
          import io
          p = 'scripts/gen_operator_pages.py'
          g = io.open(p, encoding='utf-8').read()
          assert 'op-card' not in g, 'already patched'
          def rep(s, old, new, label):
              n = s.count(old)
              assert n == 1, label + ': found ' + str(n)
              return s.replace(old, new)
          g = rep(g, '<link rel="stylesheet" href="../css/seo.css">', '<link rel="stylesheet" href="../css/seo.css?v=opt20260920">', 'css link')
          g = rep(g, 'padding-bottom:48px;max-width:720px', 'padding-bottom:48px;max-width:860px', 'main width')
          i = g.find('<h1 style="font-size:clamp(1.8rem')
          assert i > 0, 'h1 not found'
          g = g[:i] + '<div class="op-hero">' + chr(10) + g[i:]
          g = rep(g, '<div style="color:var(--ink-dim);margin-top:6px">{bn}</div>', '<div class="bn-line" style="color:var(--ink-dim);margin-top:6px">{bn}</div>', 'bn line')
          g = rep(g, '<p style="color:var(--ink-dim);line-height:1.7;max-width:700px;margin-bottom:0">{intro}</p>', '<p class="intro" style="color:var(--ink-dim);line-height:1.7;max-width:700px;margin:8px 0 0">{intro}</p>' + chr(10) + '</div>', 'intro')
          def seg(s, start, end, new, label):
              i = s.find(start)
              assert i >= 0, label + ' start missing'
              j = s.find(end, i)
              assert j >= 0, label + ' end missing'
              assert s.find(start, i + 1) < 0, label + ' duplicated'
              return s[:i] + new + s[j + len(end):]
          TQ = chr(39) * 3
          row_start = 'ROW_T = ' + TQ + '<a href="{href}" class="bj-pop-row"'
          row_end = '</a>' + TQ
          row_new = ('ROW_T = ' + TQ + '<a href="{href}" class="op-card">' + chr(10)
              + '  <span class="rt">{fr} <span class="arr">' + chr(0x2192) + '</span> {to}</span>' + chr(10)
              + '  <span class="meta">' + chr(0x1F68C) + ' {n} buses</span>' + chr(10)
              + '  <span class="go">View Schedule ' + chr(0x203A) + '</span>' + chr(10)
              + '</a>' + TQ)
          g = seg(g, row_start, row_end, row_new, 'ROW_T')
          st_start = '    stats = f' + TQ + '<section style="display:flex;gap:10px'
          st_end = '</section>' + TQ
          st_new = ('    stats = f' + TQ + '<section class="op-stats">' + chr(10)
              + '  <div class="op-stat"><div class="lbl">' + chr(0x1F68C) + ' Listed services</div><div class="val">{len(buses)}</div></div>' + chr(10)
              + '  <div class="op-stat"><div class="lbl">' + chr(0x1F5FA) + ' Routes covered</div><div class="val">{len(routes)}</div></div>' + chr(10)
              + '</section>' + TQ)
          g = seg(g, st_start, st_end, st_new, 'stats')
          g = rep(g, '<h2 style="font-size:1.25rem;margin:0 0 12px">Popular', '<h2 class="op-h2">Popular', 'popular h2')
          g = rep(g, '<div style="background:var(--panel);border:1px solid var(--border);border-radius:16px;overflow:hidden">', '<div class="op-grid">', 'grid div')
          g = rep(g, '<h2 style="font-size:1.25rem;margin:26px 0 12px">All Destinations</h2>', '<h2 class="op-h2" style="margin-top:26px">All Destinations</h2>', 'chip h2')
          io.open(p, 'w', encoding='utf-8').write(g)
          import py_compile
          py_compile.compile(p, doraise=True)
          print('operator template patched + compiles')
          PYEOF

      - name: Append operator CSS
        run: |
          if ! grep -q 'operator page redesign (2026-09-20)' css/seo.css; then
            cat >> css/seo.css << 'CSSEOF'

          /* ===== operator page redesign (2026-09-20) ===== */
          .op-hero{padding:16px 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--amber) 12%,var(--surface)),var(--surface) 60%);border:1px solid color-mix(in srgb,var(--amber) 30%,transparent);border-radius:18px;margin:4px 0 18px}
          .op-hero h1{font-family:var(--font-display)}
          .op-stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
          .op-stat{flex:1 1 170px;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:14px 16px;box-shadow:0 1px 3px rgba(28,25,23,.06)}
          .op-stat .lbl{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
          .op-stat .val{font-size:1.7rem;font-weight:700;color:var(--amber-ink)}
          .op-h2{font-size:1.25rem;margin:0 0 12px;font-family:var(--font-display)}
          .op-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin:0 0 6px}
          .op-card{display:flex;flex-direction:column;gap:9px;background:var(--surface);border:1px solid var(--border-strong);border-radius:16px;padding:14px 16px;text-decoration:none;box-shadow:0 1px 3px rgba(28,25,23,.06);transition:transform .16s ease,box-shadow .16s ease,border-color .16s ease}
          .op-card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(28,25,23,.10);border-color:color-mix(in srgb,var(--amber) 45%,transparent)}
          .op-card .rt{font-weight:700;font-size:14.5px;line-height:1.35;color:inherit}
          .op-card .rt .arr{color:var(--amber)}
          .op-card .meta{font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
          .op-card .go{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--amber-ink);background:var(--amber-soft);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);padding:4px 10px;border-radius:8px;align-self:flex-start;white-space:nowrap}
          .op-card:hover .go{background:color-mix(in srgb,var(--amber) 18%,var(--surface))}
          @media(max-width:640px){
           .op-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
           .op-card{padding:12px 13px}
           .op-stat{padding:12px 13px}
          }
          /* ===== end operator page redesign ===== */
          CSSEOF
          fi
          grep -q 'operator page redesign (2026-09-20)' css/seo.css

      - name: Regenerate operator pages
        run: python3 scripts/gen_operator_pages.py

      - name: Validate generated page
        run: |
          grep -q 'op-card' bus-time-table/sbstc-buses.html
          grep -q 'op-hero' bus-time-table/sbstc-buses.html
          grep -q 'op-stats' bus-time-table/sbstc-buses.html
          grep -q 'opt20260920' bus-time-table/sbstc-buses.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_operator_pages.py css/seo.css bus-time-table sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Operator page redesign: route card grid + hero + metric stats"
            git push
          fi
