name: Operator page redesign
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redesign:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Restore patch script (base64, unicode-safe)
        run: |
          echo '' | base64 -d > scripts/patch_operator_redesign.py

      - name: Apply patch
        run: python3 scripts/patch_operator_redesign.py

      - name: Validate source
        run: |
          python3 -m py_compile scripts/gen_operator_pages.py
          grep -q 'op-card' scripts/gen_operator_pages.py
          grep -q 'opt20260920' scripts/gen_operator_pages.py
          grep -q 'operator page redesign (2026-09-20)' css/seo.css

      - name: Regenerate operator pages
        run: python3 scripts/gen_operator_pages.py

      - name: Validate generated page
        run: |
          grep -q 'op-card' bus-time-table/sbstc-buses.html
          grep -q 'op-hero' bus-time-table/sbstc-buses.html
          grep -q 'op-stats' bus-time-table/sbstc-buses.html
          grep -q 'opt20260920' bus-time-table/sbstc-buses.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_operator_pages.py css/seo.css scripts/patch_operator_redesign.py bus-time-table sitemap.xml
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Operator page redesign: route card grid + hero + metric stats"
            git push
          fi
