name: Report system fix
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply report-system patch (extras.js, ux-fixes.js, index.html, css)
        run: python3 scripts/patch_report_system.py --write

      - name: Validate
        run: |
          node --check js/extras.js
          node --check js/ux-fixes.js
          grep -q 'bjReportType' js/extras.js
          grep -q 'loadContributors' js/extras.js
          grep -q 'sendReport' js/ux-fixes.js
          grep -q 'bjContrib' index.html
          grep -q 'js/extras.js?v=rpt20260920a' index.html
          grep -q 'js/ux-fixes.js?v=rpt20260920a' index.html
          python3 -c "s=open('index.html',encoding='utf-8').read(); assert '<html' in s and '</html>' in s; print('index.html OK')"
          echo "all checks passed"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/extras.js js/ux-fixes.js index.html css/extras.css css/ux-fixes.css
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Report system: type select (bus not running / route change), optional name, + Add time sends to review queue, footer contributors line"
            git push
          fi
