name: SEO v2 BTT index page
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate BTT index page
        run: python3 scripts/gen_btt_v2.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/gen_btt_v2.py bus-time-table/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SEO v2: regenerate BTT index (all bus timetables) hub page"
            git push
          fi
