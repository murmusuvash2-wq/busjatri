name: Kolkata city routes page deploy 20260926
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Assemble page from parts
        run: |
          python3 - <<'PYEOF'
          import base64, gzip, hashlib, json, pathlib
          pdir = pathlib.Path('parts')
          man = json.load(open(pdir / 'manifest.json'))
          for out_path, rec in man.items():
              data = b''.join(base64.b64decode((pdir / p).read_text()) for p in rec['parts'])
              raw = gzip.decompress(data)
              assert hashlib.md5(raw).hexdigest() == rec['md5'], out_path + ' md5 mismatch'
              pathlib.Path(out_path).write_bytes(raw)
              print('assembled ' + out_path + ' (' + str(len(raw)) + ' bytes)')
          PYEOF

      - name: Validate page
        run: |
          python3 - <<'PYEOF'
          import json, re, pathlib
          h = pathlib.Path('kolkata-city-routes.html').read_text(encoding='utf-8')
          n = h.count('class="rt-card"')
          assert n == 107, 'expected 107 route cards, got ' + str(n)
          assert 'og:image' in h and 'twitter:card' in h, 'missing og/twitter tags'
          t = re.search(r'<title>(.*?)</title>', h).group(1)
          assert 'City Bus Routes' in t and chr(0x09b8) in t, 'bad title: ' + t
          for key in ['__CARDS__', '__FAQ__', '__CSS__', '__TAILJS__']:
              assert key not in h, 'template leftover ' + key
          for m in re.findall(r'<script type="application/ld\+json">(.*?)</script>', h, re.S):
              json.loads(m)
          print('page validation OK: 107 cards, meta tags OK, JSON-LD parses')
          PYEOF

      - name: Add to sitemap
        run: |
          python3 - <<'PYEOF'
          import pathlib
          p = pathlib.Path('sitemap.xml')
          s = p.read_text(encoding='utf-8')
          url = 'https://busjatri.in/kolkata-city-routes.html'
          if url not in s:
              s = s.replace('</urlset>', '<url><loc>' + url + '</loc><changefreq>monthly</changefreq><priority>0.7</priority></url></urlset>')
              p.write_text(s, encoding='utf-8')
              print('sitemap: added kolkata-city-routes.html')
          else:
              print('sitemap: already present')
          PYEOF

      - name: Cleanup and commit
        run: |
          rm -rf parts
          git config user.name "busjatri-bot"
          git config user.email "action@busjatri.in"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "kolkata city bus routes hub page: 107 WBTC intra-city routes with search"
            git push
          fi
