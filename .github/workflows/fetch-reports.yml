name: Fetch user time reports
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch reports from Google Sheet CSV
        run: python3 scripts/fetch_time_reports.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/time-reports.json
          if git diff --cached --quiet; then
            echo "No new reports"
          else
            git commit -m "chore: fetch user time reports ($(date -u +%F' '%T))"
            git push
          fi
