name: Fetch user reports
on:
  schedule:
    - cron: '0 */3 * * *'   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch reports from Google Sheet CSV
        env:
          CSV_URL: ${{ secrets.REPORTS_CSV_URL }}
        run: python3 scripts/fetch_time_reports.py

      - name: Apply approved reports (time overrides + contributors)
        run: python3 scripts/apply_approved_reports.py

      - name: Sanity check
        run: |
          python3 - << 'EOF'
          import json
          ov = json.load(open('data/time-overrides.json'))
          rep = json.load(open('data/time-reports.json'))
          assert isinstance(ov, dict) and isinstance(rep, list)
          print('overrides buses:', len(ov), '| reports:', len(rep))
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/time-reports.json data/time-overrides.json data/contributors.json
          if git diff --cached --quiet; then
            echo "No new reports"
          else
            git commit -m "chore: sync user reports + apply approved times ($(date -u +%F' '%T))"
            git push
          fi
