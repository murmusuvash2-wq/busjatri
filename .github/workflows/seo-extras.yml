name: SEO extras

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Apply SEO extras patch
        run: python3 scripts/patch_seo_extras.py --write

      - name: Rebuild pages
        env:
          SITE_BASE: https://busjatri.in
        run: |
          python3 -m py_compile scripts/gen_seo_pages.py
          python3 scripts/fix_am_pm.py
          python3 scripts/gen_seo_pages.py
          python3 scripts/build_client_data.py
          python3 scripts/finalize_pages.py

      - name: Validate
        run: |
          grep -q "og:image" bus-time-table/durgapur-to-kolkata.html
          python3 - <<'EOF'
          import json
          d = json.load(open('data/busjatri_data.json'))
          assert len(d['buses']) >= 4171
          print('OK')
          EOF

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "SEO extras: og:image + twitter card on route pages, about H1 to H2"
            git push
          fi
