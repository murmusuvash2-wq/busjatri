name: Brand logo favicon fix 20260925

on:
  workflow_dispatch:

jobs:
  brand:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: pip install pillow

      - name: Run b64 fixer
        run: python3 scripts/fix_logo_b64_20260925.py

      - name: Run brand patcher
        run: python3 scripts/patch_brand_20260925.py

      - name: Validate
        run: |
          set -e
          test -f favicon.svg
          test -f favicon.png
          test -f logo.png
          test -f apple-touch-icon.png
          test -f icons/icon-192.png
          test -f icons/icon-512.png
          test -f icons/icon-maskable-192.png
          test -f icons/icon-maskable-512.png
          echo "6cd0a84c1c118b417122cdcf7f1b9fdf  logo.png" | md5sum -c -
          OLD=$(grep -rl 'data:image/svg+xml' --include='*.html' . | wc -l)
          if [ "$OLD" != "0" ]; then echo "old favicon still present in $OLD files"; exit 1; fi
          FAV=$(grep -rl 'href="/favicon.svg"' --include='*.html' . | wc -l)
          LOGO=$(grep -rl 'brand-logo' --include='*.html' . | wc -l)
          echo "favicon refs: $FAV, brand-logo refs: $LOGO"
          if [ "$FAV" -lt 5800 ]; then echo "favicon refs too low"; exit 1; fi
          if [ "$LOGO" -lt 5800 ]; then echo "brand-logo refs too low"; exit 1; fi
          if grep -q 'data:image/svg+xml' scripts/gen_btt_v2.py; then echo "generator not patched"; exit 1; fi
          echo "validation passed"

      - name: Commit and push
        run: |
          git config user.name "busjatri-bot"
          git config user.email "action@busjatri.in"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to commit"
          else
            git commit -m "brand: BusJatri circular logo + navy front-bus favicon site-wide"
            git push
          fi
