name: Fix crawler + dry-run test

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Apply crawler link fix
        run: python3 scripts/fix_crawler.py

      - name: Commit fixed crawler
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/fill_missing_times.py
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Crawler: accept relative wbbustime.in links (discovery was returning 0 pages)"
            git push
          fi

      - name: Dry-run crawl (report only, no data changes)
        run: python3 scripts/fill_missing_times.py --crawl --dry-run
