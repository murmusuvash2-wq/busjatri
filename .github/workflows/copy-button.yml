name: Copy button text v2

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy-button:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply patch
        run: python3 scripts/patch_copy_button.py

      - name: Bump bus-page.js cache version in index.html
        run: |
          sed -i 's|js/bus-page.js?v=bj[0-9a-z]*|js/bus-page.js?v=bj20260923a|' index.html
          grep -o 'js/bus-page.js?v=[0-9a-z]*' index.html

      - name: Validate
        run: |
          node --check js/bus-page.js
          grep -q "Arrival: ' + b.arrival_time" js/bus-page.js
          grep -q 'Departure: ' js/bus-page.js
          grep -q 'Stoppages:' js/bus-page.js
          grep -q 'js/bus-page.js?v=bj20260923a' index.html

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/bus-page.js scripts/patch_copy_button.py index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Copy button: well-organised text with departure + arrival + numbered stoppages; cache version bump"
            git push
          fi
