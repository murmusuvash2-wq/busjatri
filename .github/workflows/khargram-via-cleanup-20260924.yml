name: Khargram via cleanup (delete stale stop page)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  khargram-via-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Delete stale via page + strip sitemap entry
        run: python3 scripts/patch_khargram_via_cleanup.py

      - name: Rebuild via index + sitemap-via
        run: |
          python3 scripts/gen_via_stop_v2.py
          python3 scripts/patch_via_sitemap.py

      - name: Validate
        run: |
          test ! -f via/khargram.html
          test ! -f bus-time-table/kolkata-to-khargram.html
          if grep -q 'khargram' sitemap.xml; then echo "ERROR khargram in sitemap.xml"; exit 1; fi
          if grep -q 'khargram' sitemap-via.xml; then echo "ERROR khargram in sitemap-via.xml"; exit 1; fi
          if grep -q 'khargram' via/index.html; then echo "ERROR khargram in via/index.html"; exit 1; fi
          if grep -q 'khargram' data/busjatri_data.json; then echo "ERROR khargram in data"; exit 1; fi
          test -f via/esplanade.html
          grep -q '2604 stops' via/index.html
          grep -q 'nbstc-fb-cb-siliguri-800pm' data/busjatri_data.json
          echo "validation OK"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/patch_khargram_via_cleanup.py via sitemap.xml sitemap-via.xml robots.txt
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Delete stale via/khargram stop page and strip its sitemap entries (khargram never existed - was misread Jhargram)"
            git push
          fi
